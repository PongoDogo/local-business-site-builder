name: Check skill
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run validate
      - run: npm run doctor
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: skill-${{ matrix.os }}-node${{ matrix.node }}
          path: dist/local-business-site-builder.zip
